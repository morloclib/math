name: math
version: 0.1.0
homepage: https://github.com/morloclib/math
synopsis: Fundamental mathematical functions
description: >
  Type-signature-only module providing fundamental mathematical building blocks:
  trigonometric, hyperbolic, exponential, logarithmic, rounding, and sign
  functions with Numeric typeclass constraints. Language-specific implementations
  are provided by companion modules (e.g., math-cpp, math-py).
category: math
